<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Davante Academy</title>
    <!-- Enlace a Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="card shadow-sm" style="width: 100%; max-width: 500px;">
            <div class="card-body p-4 text-center">
                <h2 class="mb-4 fw-bold">Davante Academy</h2>
                <h4 class="mb-4">Crear una cuenta</h4>
                
                <form>
                    <div class="mb-3 text-start">
                        <label for="nombre" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="mb-4 text-start">
                        <label for="password-confirm" class="form-label">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="password-confirm" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2">Registrarse</button>
                </form>
                
                <div class="mt-4">
                    <p class="mb-0">¿Ya tienes cuenta? <a href="login.html" class="text-dark fw-bold">Inicia sesión</a></p>
                    <p class="mt-2"><a href="index.html" class="text-secondary text-decoration-none">← Volver al inicio</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
