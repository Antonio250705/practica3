<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Davante Academy</title>
    <!-- Enlace a Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <!-- Aumentamos el max-width a 500px -->
        <div class="card shadow" style="width: 100%; max-width: 500px;">
            <!-- Aumentamos el padding de p-4 a p-5 -->
            <div class="card-body p-5 text-center">
                <h2 class="mb-4 fw-bold">Davante Academy</h2>
                <h4 class="mb-5 text-secondary">Iniciar Sesión</h4>
                
                <form>
                    <div class="mb-4 text-start">
                        <label for="email" class="form-label fw-semibold">Correo electrónico</label>
                        <!-- Añadimos form-control-lg para hacer el campo más grande -->
                        <input type="email" class="form-control form-control-lg" id="email" placeholder="nombre@ejemplo.com" required>
                    </div>
                    <div class="mb-5 text-start">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <!-- Añadimos form-control-lg -->
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Tu contraseña" required>
                    </div>
                    <!-- Añadimos btn-lg para un botón más imponente -->
                    <button type="submit" class="btn btn-dark btn-lg w-100 py-3 fw-bold">Entrar</button>
                </form>
                
                <div class="mt-5">
                    <p class="mb-2 fs-5">¿No tienes cuenta? <a href="registro.html" class="text-dark fw-bold">Regístrate aquí</a></p>
                    <p class="mt-3"><a href="index.html" class="text-secondary text-decoration-none">← Volver al inicio</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
